name: SudokuSnap
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
  xcodeVersion: '16.4'
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
targets:
  SudokuCoreBindings:
    type: framework
    platform: iOS
    sources:
      - path: Sources/SudokuCoreBindings/SudokuCoreBindings.swift
    dependencies:
      - framework: ../../target/ios-core/SudokuCoreFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sudokusnap.corebindings
        GENERATE_INFOPLIST_FILE: YES
  SudokuSnap:
    type: application
    platform: iOS
    sources:
      - path: Sources/SudokuSnap
    dependencies:
      - target: SudokuCoreBindings
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sudokusnap.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sudoku Snap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
    info:
      path: Generated/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: org.sudokusnap.import
            CFBundleURLSchemes: [sudokusnap]
  SudokuSnapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: ../../benchmarks/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: SudokuSnap
      - target: SudokuCoreBindings
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.sudokusnap.tests
  SudokuSnapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SudokuSnap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.sudokusnap.uitests
  SudokuSnapOCRTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: OCRTests
      - path: ../../tests/fixtures/original.jpeg
        buildPhase: resources
      - path: ../../tests/fixtures/expected.json
        buildPhase: resources
      - path: ../../tests/fixtures/dark-highlighted.jpeg
        buildPhase: resources
      - path: ../../tests/fixtures/dark-highlighted.json
        buildPhase: resources
    dependencies:
      - target: SudokuSnap
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: org.sudokusnap.ocrtests
schemes:
  SudokuSnap:
    build:
      targets:
        SudokuSnap: all
        SudokuSnapTests: [test]
        SudokuSnapUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - SudokuSnapTests
        - SudokuSnapUITests
    archive:
      config: Release
  SudokuSnapOCR:
    build:
      targets:
        SudokuSnap: all
        SudokuSnapOCRTests: [test]
    test:
      targets:
        - SudokuSnapOCRTests
